name: owj
description: أوج - مرشدك الذكي الشخصي بالعربي المصري
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # AI Providers
  google_generative_ai: ^0.4.7
  dart_openai: ^5.1.0
  http: ^1.3.0

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # TTS & Audio
  flutter_tts: ^4.2.2
  audioplayers: ^6.1.0

  # UI
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_svg: ^2.1.0
  percent_indicator: ^4.2.4
  smooth_page_indicator: ^1.2.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  package_info_plus: ^8.3.0
  device_info_plus: ^11.3.0
  permission_handler: ^11.4.0
  markdown_widget: ^2.3.2+6
  speech_to_text: ^7.0.0

  # Firebase
  firebase_core: ^3.13.0
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
