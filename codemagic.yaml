workflows:
  android-release:
    name: OWJ Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      vars:
        # Set these in Codemagic UI under Environment Variables
        # Or use encrypted environment variables
        GEMINI_API_KEY:
        GROQ_API_KEY:
        BIGMODEL_API_KEY:
        OPENROUTER_API_KEY:
        CEREBRAS_API_KEY:
        MEM0_API_KEY:
        TAVILY_API_KEY:
        ELEVENLABS_API_KEY:
        YOUTUBE_API_KEY:
        FIREBASE_API_KEY:
        FIREBASE_APP_ID:

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Set up local properties
        script: echo "flutter.minSdkVersion=24" >> "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos

      - name: Flutter unit tests
        script: flutter test

      - name: Build APK with environment variables
        script: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY \
            --dart-define=GROQ_API_KEY=$GROQ_API_KEY \
            --dart-define=BIGMODEL_API_KEY=$BIGMODEL_API_KEY \
            --dart-define=OPENROUTER_API_KEY=$OPENROUTER_API_KEY \
            --dart-define=CEREBRAS_API_KEY=$CEREBRAS_API_KEY \
            --dart-define=MEM0_API_KEY=$MEM0_API_KEY \
            --dart-define=TAVILY_API_KEY=$TAVILY_API_KEY \
            --dart-define=ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY \
            --dart-define=YOUTUBE_API_KEY=$YOUTUBE_API_KEY \
            --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY \
            --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID

      - name: Build App Bundle with environment variables
        script: |
          flutter build appbundle --release \
            --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY \
            --dart-define=GROQ_API_KEY=$GROQ_API_KEY \
            --dart-define=BIGMODEL_API_KEY=$BIGMODEL_API_KEY \
            --dart-define=OPENROUTER_API_KEY=$OPENROUTER_API_KEY \
            --dart-define=CEREBRAS_API_KEY=$CEREBRAS_API_KEY \
            --dart-define=MEM0_API_KEY=$MEM0_API_KEY \
            --dart-define=TAVILY_API_KEY=$TAVILY_API_KEY \
            --dart-define=ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY \
            --dart-define=YOUTUBE_API_KEY=$YOUTUBE_API_KEY \
            --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY \
            --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID

    artifacts:
      - build/**/outputs/apk/**/*.apk
      - build/**/outputs/bundle/**/*.aab
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - owj-app@example.com
        notify:
          success: true
          failure: true

  android-debug:
    name: OWJ Android Debug
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos

      - name: Build debug APK
        script: flutter build apk --debug

    artifacts:
      - build/**/outputs/apk/**/*.apk
